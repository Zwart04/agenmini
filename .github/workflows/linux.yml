name: Linux desktop packages
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: gateway/go.sum
      - name: Build packaged connection gateway
        run: |
          mkdir -p gateway-dist
          cd gateway
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../gateway-dist/agenmini-gateway ./cmd/agenmini-gateway
      - name: Build native formats with private runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rpm zstd desktop-file-utils
          python -m pip install uv==0.12.23
          python linux/build.py --gateway gateway-dist/agenmini-gateway
      - name: Test Debian package in Debian 13
        run: docker run --rm -v "$PWD:/src:ro" -v "$PWD/dist:/dist:ro" debian:13 bash /src/linux/check_package.sh deb
      - name: Test Debian package in Ubuntu 24.04
        run: docker run --rm -v "$PWD:/src:ro" -v "$PWD/dist:/dist:ro" ubuntu:24.04 bash /src/linux/check_package.sh deb
      - name: Test RPM package in Fedora
        run: docker run --rm -v "$PWD:/src:ro" -v "$PWD/dist:/dist:ro" fedora:44 bash /src/linux/check_package.sh rpm
      - name: Test Arch package using pacman
        if: matrix.arch == 'amd64'
        run: docker run --rm -v "$PWD:/src:ro" -v "$PWD/dist:/dist:ro" archlinux:base bash /src/linux/check_package.sh arch
      - uses: actions/upload-artifact@v4
        if: github.event.repository.private != true
        with:
          name: linux-packages-${{ matrix.arch }}
          path: |
            dist/*.deb*
            dist/*.rpm*
            dist/*.pkg.tar.zst*
            dist/*-linux-*.tar.gz*
      - name: Save verified private Linux build
        if: github.event.repository.private == true && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python .github/scripts/private_build.py linux
        env:
          GH_TOKEN: ${{ github.token }}
