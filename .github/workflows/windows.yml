name: Windows installer
on: [push, workflow_dispatch]
jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r requirements.lock
      - name: Install compiler
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Guarded customization and repair on native Windows
        run: |
          python -m pip install pytest pytest-asyncio
          python -m pytest tests/test_customization_repair.py tests/test_frontend_syntax.py tests/test_deepseek_core.py tests/test_local_workflow.py tests/test_projects.py tests/test_project_parts.py -q
      - run: python windows/build.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Actual installer lifecycle and native app
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist/agenmini-setup-*-windows-x64.exe | Select-Object -First 1).FullName
          $target = Join-Path $env:RUNNER_TEMP 'agenmini-installed-test'
          $env:AGENMINI_DATA_DIR = Join-Path $env:RUNNER_TEMP 'agenmini-private-test-data'
          $p = Start-Process -FilePath $exe -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$target") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exit $($p.ExitCode)" }
          python windows/check_installed.py $target $exe
          if ($LASTEXITCODE -ne 0) { throw 'Installed integration failed' }
      - uses: actions/upload-artifact@v4
        if: github.event.repository.private != true
        with:
          name: windows-installer
          path: |
            dist/agenmini-setup-*-windows-x64.exe
            dist/agenmini-setup-*-windows-x64.exe.sha256
            dist/agenmini-*-windows-x64.zip*
          retention-days: 7
      - name: Save verified private Windows build
        if: github.event.repository.private == true && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python .github/scripts/private_build.py windows
        env:
          GH_TOKEN: ${{ github.token }}
