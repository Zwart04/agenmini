name: Publish verified release
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PRIVATE_RELEASE: ${{ github.event.repository.private }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require successful Linux and installed Windows checks for this commit
        shell: bash
        run: |
          set -euo pipefail
          for workflow in test.yml windows.yml linux.yml harnesses.yml secrets.yml; do
            run_id=$(gh run list --workflow "$workflow" --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId')
            test -n "$run_id" && test "$run_id" != null
            gh run watch "$run_id" --exit-status
            test "$(gh run view "$run_id" --json conclusion --jq .conclusion)" = success
            if test "$workflow" = windows.yml; then echo "WINDOWS_RUN=$run_id" >> "$GITHUB_ENV"; fi
            if test "$workflow" = test.yml; then echo "TEST_RUN=$run_id" >> "$GITHUB_ENV"; fi
            if test "$workflow" = linux.yml; then echo "LINUX_RUN=$run_id" >> "$GITHUB_ENV"; fi
          done
      - name: Build source and VPS assets and obtain tested Windows installer
        shell: bash
        run: |
          set -euo pipefail
          python3 build_release.py
          if test "$PRIVATE_RELEASE" = true; then
            tag=$(python -c 'from app import VERSION; print("v"+VERSION)')
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir dist --clobber
          else
            gh run download "$WINDOWS_RUN" --name windows-installer --dir dist
            gh run download "$TEST_RUN" --name gateway-binaries --dir dist
            gh run download "$LINUX_RUN" --name linux-packages-amd64 --dir dist
            gh run download "$LINUX_RUN" --name linux-packages-arm64 --dir dist
          fi
          python3 - <<'PY'
          import hashlib,re,zipfile
          from pathlib import Path
          version=re.search(r'VERSION\s*=\s*"([^"]+)"',Path('app/__init__.py').read_text())[1]
          exe=Path('dist')/('agenmini-setup-'+version+'-windows-x64.exe')
          assert exe.read_bytes()[:2]==b'MZ'
          checksum=exe.with_suffix('.exe.sha256').read_text().split()[0]
          assert hashlib.sha256(exe.read_bytes()).hexdigest()==checksum
          for name in ('agenmini-source.zip','agenmini-vps.zip','agenmini-frontend.zip'):
              with zipfile.ZipFile(Path('dist')/name) as archive:assert archive.testzip() is None
          Path('release-tag.txt').write_text('v'+version)
          Path('release-notes.md').write_text(Path('RELEASE-NOTES.md').read_text())
          PY
      - name: Publish and verify public downloads
        shell: bash
        run: |
          set -euo pipefail
          tag=$(cat release-tag.txt)
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          files=sorted(p for p in Path('dist').iterdir() if p.is_file() and p.name!='SHA256SUMS')
          Path('dist/SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files))
          PY
          if test "$PRIVATE_RELEASE" = true; then
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
            test "$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
            gh release upload "$tag" dist/*.zip dist/*.exe dist/*.deb dist/*.rpm dist/*.pkg.tar.zst dist/*-linux-*.tar.gz dist/*.sha256 dist/pasang-vps.sh dist/SHA256SUMS dist/agenmini-gateway-linux-amd64 dist/agenmini-gateway-linux-arm64 --clobber
            gh release edit "$tag" --title "Agen Mini $tag — private preview" --notes-file release-notes.md
          else
            gh release create "$tag" dist/*.zip dist/*.exe dist/*.deb dist/*.rpm dist/*.pkg.tar.zst dist/*-linux-*.tar.gz dist/*.sha256 dist/pasang-vps.sh dist/SHA256SUMS dist/agenmini-gateway-linux-amd64 dist/agenmini-gateway-linux-arm64 --draft --target "$GITHUB_SHA" --title "Agen Mini $tag" --notes-file release-notes.md
          fi
          gh release edit "$tag" --draft=false
          mkdir public-verification
          python3 - <<'PY'
          import hashlib,json,urllib.request,os
          from pathlib import Path
          import subprocess
          tag=Path('release-tag.txt').read_text()
          release=json.loads(subprocess.check_output(['gh','release','view',tag,'--json','assets']))
          for asset in release['assets']:
              source=Path('dist')/asset['name']
              if os.environ.get('PRIVATE_RELEASE')=='true':
                  subprocess.run(['gh','release','download',tag,'--pattern',asset['name'],'--dir','public-verification','--repo',os.environ['GITHUB_REPOSITORY']],check=True)
                  data=(Path('public-verification')/asset['name']).read_bytes()
              else:
                  request=urllib.request.Request(asset['url'],headers={'User-Agent':'AgenMini-Release-Verification'})
                  with urllib.request.urlopen(request,timeout=120) as response:data=response.read()
              assert hashlib.sha256(data).digest()==hashlib.sha256(source.read_bytes()).digest(),asset['name']
              print('Release download SHA256 verified:',asset['name'])
          PY
